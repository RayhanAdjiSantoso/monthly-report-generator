# Local build/run parity check now, and the same file doubles as the deploy
# template for a VPS / office server later (see DEPLOY.md) — `docker compose
# up -d` behaves identically in both places, since Postgres lives on Neon in
# either case (nothing to run alongside the backend here).
services:
  backend:
    build: .
    ports:
      - '3001:3001'
    env_file:
      - .env
    restart: unless-stopped
